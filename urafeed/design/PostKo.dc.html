</helmet>
<div style="width: 1440px; height: 1100px; position: relative; overflow: hidden; font-family: Poppins, 'Noto Sans JP', 'Noto Sans KR', sans-serif; color: #f3f1fa; background: #0b0a10">
  <div style="position: absolute; inset: 0; display: flex; filter: blur(2px); opacity: 0.4">

  </div>
  <div style="position: absolute; inset: 0; background: rgba(5,4,9,0.72)"></div>
  <div role="dialog" aria-label="포스트" style="position: absolute; left: 50%; top: 40px; transform: translateX(-50%); width: 640px; max-height: 1020px; border-radius: 24px; background: #120f19; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 30px 80px rgba(0,0,0,0.6); display: flex; flex-direction: column; overflow: hidden">
    <header style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.06)">
      <a href="MainKo.dc.html" aria-label="닫기" style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #f3f1fa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
      <span style="font-size: 18px; font-weight: 800">포스트</span>
    </header>
    <div style="flex: 1; overflow: auto">
      <div style="padding: 18px 20px 6px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; gap: 12px">
          <img src="../images/a01.jpg" alt="" style="width: 52px; height: 52px; border-radius: 50%; object-fit: cover">
          <div style="display: flex; flex-direction: column; gap: 2px"><span style="display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 800">미나미🌙<span style="font-size: 10px; font-weight: 800; color: #ffffff; background: linear-gradient(95deg, #ff3d7f 0%, #c04dff 100%); border-radius: 5px; padding: 1px 5px; line-height: 16px">뒷</span></span><span style="font-size: 13px; color: #8f8aa3">@yoru_no_ol</span></div>
          <button type="button" style="margin-left: auto; height: 36px; padding: 0 18px; border-radius: 99px; border: 0; background: #ffffff; color: #17151f; font-size: 13px; font-weight: 800">팔로우</button>
        </div>
        <p style="margin: 0; font-size: 19px; line-height: 1.75; white-space: pre-wrap">야근 끝. 상사가 퇴근하면서 어깨를 툭 쳤는데, 그것만으로 지하철에서 계속 두근거려.
나, 이상한가 봐…</p>
        <span style="font-size: 15px; color: #ff7aa8; font-weight: 700">#야근 #잠이안와</span>
        <span style="font-size: 13px; color: #8f8aa3">23:47 · 2026년 11월 14일 · <b style="color: #f3f1fa">4.8만</b> 조회</span>
        <div style="display: flex; gap: 18px; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.06); border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 14px">

      </div>
      <form style="display: flex; gap: 10px; align-items: center; padding: 12px 20px; border-top: 1px solid rgba(255,255,255,0.06); border-bottom: 1px solid rgba(255,255,255,0.06)">

      </form>
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 20px">
        <sc-for list="{{comments}}" as="c" hint-placeholder-count="4">
          <div style="display: flex; gap: 10px; padding: 12px; border-radius: 16px; border: {{c.bd}}; background: {{c.bg}}">
            <sc-if value="{{c.isChara}}" hint-placeholder-val="{{ true }}"><img src="{{c.img}}" alt="" style="width: 38px; height: 38px; border-radius: 50%; object-fit: cover; flex: none"></sc-if>
            <sc-if value="{{c.isUser}}" hint-placeholder-val="{{ false }}"><span style="width: 38px; height: 38px; border-radius: 50%; background: #2a2236; color: #c9c4da; display: flex; align-items: center; justify-content: center; font-weight: 800; flex: none">{{c.initial}}</span></sc-if>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <div style="display: flex; align-items: center; gap: 6px; font-size: 13px">
                <b>{{c.name}}</b>
                <sc-if value="{{c.isSelf}}" hint-placeholder-val="{{ false }}"><span style="font-size: 10px; font-weight: 800; color: #ffffff; background: #ff3d7f; border-radius: 5px; padding: 1px 6px">본인</span></sc-if>
                <sc-if value="{{c.isChara}}" hint-placeholder-val="{{ false }}"><span style="font-size: 10px; font-weight: 800; color: #ffffff; background: linear-gradient(95deg, #ff3d7f 0%, #c04dff 100%); border-radius: 5px; padding: 1px 5px; line-height: 16px">뒷</span></sc-if>
                <span style="color: #8f8aa3">{{c.handle}} · {{c.time}}</span>
              </div>
              <p style="margin: 0; font-size: 14px; line-height: 1.6">{{c.body}}</p>
              <span style="display: flex; align-items: center; gap: 5px; font-size: 12px; color: #a19db3"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.4-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.8-7.5 10.2-7.5 10.2z"/></svg>{{c.likes}}</span>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
    <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: linear-gradient(90deg, rgba(255,61,127,0.22) 0%, rgba(192,77,255,0.16) 100%); border-top: 1px solid rgba(255,61,127,0.35)">
      <img src="../images/a01.jpg" alt="" style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover">
      <span style="flex: 1; display: flex; flex-direction: column"><b style="font-size: 14px">이 뒷얘기, DM으로 물어보기</b><span style="font-size: 12px; color: #c9c4da">이 포스트 얘기로 미나미가 먼저 말을 걸어요</span></span>
      <span style="display: inline-flex; align-items: center; height: 40px; padding: 0 18px; border-radius: 12px; background: #ffffff; color: #17151f; font-size: 13px; font-weight: 800">DM하기 →</span>
    </a>
  </div>
</div>
</x-dc>
