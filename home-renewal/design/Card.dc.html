<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>캐릭터 카드</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<article style="width: 100%; display: flex; flex-direction: column; gap: 8px; font-family: Poppins, 'Noto Sans JP', 'Noto Sans KR', sans-serif; color: #f3f1fa">
  <a href="Detail.dc.html" aria-label="{{it.title}} 자세히 보기" style="position: relative; display: block; width: 100%; aspect-ratio: 3 / 4; border-radius: 16px; overflow: hidden; background: {{it.tone}}; color: #ffffff; text-decoration: none">
    <sc-if value="{{it.hasImg}}" hint-placeholder-val="{{ false }}">
      <img src="{{it.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top center">
    </sc-if>
    <sc-if value="{{noImg}}" hint-placeholder-val="{{ true }}">
      <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 800; color: rgba(255,255,255,0.28)">{{it.initial}}</span>
    </sc-if>
    <div style="position: absolute; top: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 6px">
      <div style="display: flex; gap: 4px; flex-wrap: wrap">
        <sc-if value="{{it.isNew}}" hint-placeholder-val="{{ false }}">
          <span style="width: 20px; height: 20px; border-radius: 6px; background: #ff3d7f; color: #ffffff; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">N</span>
        </sc-if>
        <sc-if value="{{it.hasType}}" hint-placeholder-val="{{ false }}">
          <span style="height: 20px; box-sizing: border-box; border-radius: 6px; background: rgba(15,13,23,0.78); color: #ffffff; font-size: 10px; font-weight: 800; padding: 0 6px; display: flex; align-items: center">{{it.type}}</span>
        </sc-if>
      </div>
      <span style="display: flex; align-items: center; gap: 6px; height: 22px; box-sizing: border-box; padding: 0 8px; border-radius: 99px; background: rgba(15,13,23,0.72); font-size: 11px; font-weight: 700; white-space: nowrap">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>{{it.likes}}
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.6 7.3L3 21l2.2-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>{{it.chats}}
      </span>
    </div>
    <sc-if value="{{it.hasRank}}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 10px 8px; background: linear-gradient(180deg, rgba(15,13,23,0) 0%, rgba(15,13,23,0.85) 100%); display: flex; align-items: flex-end; gap: 6px">
        <span style="font-size: 40px; line-height: 0.9; font-weight: 800; font-style: italic; color: {{it.rankColor}}">{{it.rank}}</span>
        <span style="font-size: 11px; font-weight: 700; color: {{it.moveColor}}; padding-bottom: 3px">{{it.move}}</span>
      </div>
    </sc-if>
    <sc-if value="{{hover}}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; inset: 0; background: rgba(15,13,23,0.78); display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding: 12px">
        <span style="font-size: 11px; font-weight: 700; color: #ff9cc0">첫 대사</span>
        <span style="font-size: 13px; line-height: 1.55; color: #ffffff">「{{it.opening}}」</span>
        <span style="display: flex; align-items: center; justify-content: center; height: 38px; border-radius: 10px; background: linear-gradient(95deg, #ff3d7f 0%, #c04dff 55%, #6f5bff 100%); font-size: 13px; font-weight: 800">바로 대화하기</span>
      </div>
    </sc-if>
  </a>
  <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
    <span style="font-size: 14px; font-weight: 800; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.title}}</span>
    <span style="font-size: 12px; line-height: 1.5; color: #a19db3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 36px">{{it.hook}}</span>
    <div style="display: flex; gap: 4px; flex-wrap: nowrap; overflow: hidden">
      <sc-for list="{{it.tags}}" as="tg" hint-placeholder-count="3">
        <span style="flex: none; font-size: 11px; color: #c9c4da; background: rgba(255,255,255,0.06); border-radius: 99px; padding: 2px 8px">#{{tg}}</span>
      </sc-for>
    </div>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #a19db3">
      <span style="width: 16px; height: 16px; border-radius: 50%; background: {{it.creatorTone}}"></span>{{it.creator}}
    </span>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"item":{"editor":null},"hover":{"editor":"boolean","default":false},"$preview":{"width":200,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    const d = { title: '超人気アイドルの裏の顔', hook: 'ステージでは完璧なセンター。でも楽屋ではプロデューサーのあなたにだけ甘えんぼ。', tags: ['アイドル', 'ギャップ萌え', '甘々'], creator: '工房ミント', likes: '2.4k', chats: '812k', tone: '#4a2a44', creatorTone: '#ff9cc0', initial: 'ひ', isNew: true, type: '', rank: 0, opening: 'あ、プロデューサーさん…今日の私、ちゃんとできてた？' };
    d.img = '../../home/c01_idol.png';
    const it0 = this.props.item || d;
    const it = { ...it0,
      hasImg: !!it0.img, hasType: !!it0.type, hasRank: !!it0.rank,
      rankColor: it0.rank === 1 ? '#ffc847' : it0.rank === 2 ? '#e5e7eb' : it0.rank === 3 ? '#f0a46b' : '#ffffff',
      move: it0.move || '', moveColor: (it0.move || '').indexOf('▼') === 0 ? '#93c5fd' : '#ff9cc0',
      initial: it0.initial || (it0.title || '').slice(0, 1) };
    return { it, noImg: !it0.img, hover: !!this.props.hover };
  }
}
</script>
</body>
</html>
