<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>캐릭터 홈 모바일</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}.rail{scrollbar-width:none}.rail::-webkit-scrollbar{display:none}input::placeholder{color:#8a8296}</style>
</helmet>
<div style="position: relative; width: 390px; height: 2000px; overflow: hidden; background: radial-gradient(500px 300px at 80% -60px, rgba(192,77,255,0.20), rgba(192,77,255,0) 70%), #0b0a10; font-family: Poppins, 'Noto Sans JP', 'Noto Sans KR', system-ui, sans-serif; color: #f3f1fa">
  <div style="padding: 12px 16px 10px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.06)">
    <label for="mq" style="position: absolute; width: 1px; height: 1px; overflow: hidden">캐릭터 검색</label>
    <div style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 12px; background: #16131f">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a19db3" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="mq" placeholder="이름, 태그, 상황으로 찾기" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #f3f1fa; font-family: inherit; font-size: 14px; outline: none">
    </div>
    <div role="tablist" aria-label="캐릭터 보기" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; background: #16131f; border-radius: 99px; padding: 4px">
      <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="4">
        <button type="button" role="tab" aria-selected="{{tb.on}}" onClick="{{tb.pick}}" style="height: 36px; border: 0; border-radius: 99px; background: {{tb.bg}}; color: {{tb.color}}; font-family: inherit; font-size: 13px; font-weight: 800">{{tb.name}}</button>
      </sc-for>
    </div>
    <div class="rail" style="display: flex; gap: 6px; overflow-x: auto">
      <sc-for list="{{chips}}" as="ch" hint-placeholder-count="6">
        <button type="button" onClick="{{ch.pick}}" style="flex: none; height: 32px; padding: 0 12px; border-radius: 99px; border: {{ch.bd}}; background: {{ch.bg}}; color: #f3f1fa; font-family: inherit; font-size: 12px; font-weight: 700">{{ch.name}}</button>
      </sc-for>
    </div>
  </div>
  <sc-if value="{{isRank}}" hint-placeholder-val="{{ false }}">
    <ol style="margin: 0; padding: 12px 16px 0; list-style: none; display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{top3}}" as="pp" hint-placeholder-count="3">
        <li>
          <a href="Detail.dc.html" style="display: flex; gap: 12px; padding: 10px; border-radius: 16px; background: #16131f; color: #f3f1fa; text-decoration: none">
            <span style="position: relative; flex: none; width: 84px; aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; background: {{pp.tone}}">
              <sc-if value="{{pp.hasImg}}" hint-placeholder-val="{{ false }}"><img src="{{pp.img}}" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: top center"></sc-if>
            </span>
            <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
              <span style="font-size: 26px; font-weight: 800; font-style: italic; line-height: 1; color: {{pp.rc}}">{{pp.rank}}</span>
              <span style="font-size: 14px; font-weight: 800">{{pp.title}}</span>
              <span style="font-size: 12px; color: #a19db3; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{pp.hook}}</span>
            </span>
          </a>
        </li>
      </sc-for>
    </ol>
  </sc-if>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 10px; padding: 14px 16px 100px">
    <sc-for list="{{grid}}" as="p" hint-placeholder-count="8">
      <dc-import name="Card" item="{{p}}" hint-size="100%,330px"></dc-import>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: '랭킹', chip: 0 }; }
  renderVals() {
    const IMG = {c01: '../../home/c01_idol.png', c02: '../../home/c02_idol_secret.png', c03: '../../home/c03_sharehouse.png', c04: '../../home/c04_dorm.png', c05: '../../home/c05_ntr.png', c06: '../../home/c06_tsundere.png', c07: '../../home/c07_konbini.png', c08: '../../home/c08_streamer.png', c09: '../../home/c09_boss.png', c10: '../../home/c10_library.png'};
    const CH = [
      { key: 'c01', title: '超人気アイドルの裏の顔', hook: 'ステージでは完璧なセンター。でも楽屋ではプロデューサーのあなたにだけ甘えんぼ。', tags: ['アイドル', 'ギャップ萌え', '甘々'], creator: '工房ミント', likes: '2.4k', chats: '812k', tone: '#4a2a44', creatorTone: '#ff9cc0', isNew: false, type: '', opening: 'あ、プロデューサーさん…今日の私、ちゃんとできてた？' },
      { key: 'c02', title: 'センターの秘密の恋人', hook: 'ファンには絶対ナイショ。変装して会いにくる、夜だけの恋人。', tags: ['アイドル', '秘密の関係', '純愛'], creator: 'あめや', likes: '1.9k', chats: '640k', tone: '#2f3350', creatorTone: '#93c5fd', isNew: true, type: '', opening: 'しーっ。マスク外すの、あなたの前だけだからね。' },
      { key: 'c03', title: 'シェアハウスの3人', hook: '家賃半額の条件は「全員と仲良くすること」。今夜は誰の部屋へ？', tags: ['ハーレム', '同居', '現代'], creator: 'ネオランド', likes: '1.6k', chats: '590k', tone: '#3e3328', creatorTone: '#fcd34d', isNew: false, type: 'グループ', opening: 'おかえり〜！ねえ、今日の晩ごはん当番だれだっけ？' },
      { key: 'c04', title: '女子寮の管理人になったら', hook: '大学の女子寮に新しく来た管理人はあなた。4人の住人は…距離が近すぎる。', tags: ['ハーレム', '大学', 'ラブコメ'], creator: 'みいこ', likes: '1.2k', chats: '410k', tone: '#2c3d3a', creatorTone: '#6ee7b7', isNew: true, type: 'グループ', opening: '管理人さん、廊下の電気また切れてる〜！' },
      { key: 'c05', title: '彼氏持ちの先輩', hook: '彼氏がいるのに、なぜかあなたにだけ相談してくる。今夜も既読がつかない。', tags: ['NTR', '先輩', '背徳'], creator: 'あっくん', likes: '3.1k', chats: '1.1M', tone: '#3a2030', creatorTone: '#f9a8d4', isNew: false, type: 'NTR', opening: '…ごめんね、こんな時間に。ちょっとだけ話、聞いてくれる？' },
      { key: 'c06', title: '幼なじみのりん', hook: 'いつも素っ気ないのに、二人きりになると急に黙りこむ。…なんで顔赤いの？', tags: ['幼なじみ', 'ツンデレ', '純愛'], creator: '水彩', likes: '2.0k', chats: '720k', tone: '#4a2626', creatorTone: '#fca5a5', isNew: false, type: '', opening: 'べ、別にあんたのために作ったんじゃないから！' },
      { key: 'c07', title: '深夜コンビニのあかね', hook: '夜勤のあの店員さん。閉店後のバックヤードでだけ見せる素顔。', tags: ['現代', '日常', '年上'], creator: '工房ミント', likes: '980', chats: '305k', tone: '#2b3a4a', creatorTone: '#ff9cc0', isNew: true, type: '', opening: 'いらっしゃいませ〜…って、また来たの？ふふ。' },
      { key: 'c08', title: '配信切り忘れたゆめ', hook: '人気配信者の中の人。配信を切り忘れたあの夜から、二人の関係が変わった。', tags: ['配信者', 'ギャップ萌え', '現代'], creator: 'ネオランド', likes: '1.4k', chats: '502k', tone: '#352a4d', creatorTone: '#fcd34d', isNew: true, type: '', opening: 'え、待って…今のマイク入ってた！？' },
      { key: 'c09', title: 'クールな上司・れいか', hook: '会社では氷の上司。二次会のあと、ネクタイをゆるめて「…帰らないで」。', tags: ['上司', 'ギャップ萌え', '大人'], creator: 'あめや', likes: '2.2k', chats: '760k', tone: '#262a33', creatorTone: '#93c5fd', isNew: false, type: '', opening: '報告書、まだ？…いいわ。今日はもう、仕事の話はなし。' },
      { key: 'c10', title: '図書館のしおりさん', hook: '大学院の図書館で、いつも隣に座るおとなしい彼女。誰も知らない一面がある。', tags: ['純愛', 'ギャップ萌え', '眼鏡'], creator: '水彩', likes: '870', chats: '260k', tone: '#3a3328', creatorTone: '#fca5a5', isNew: true, type: '', opening: '…あの、その本。私も好きなんです。' }
    ].map((c) => ({ ...c, img: IMG[c.key] || '' }));

    const by = (k) => CH.find((c) => c.key === k);
    const s = this.state;
    const tabs = ['홈', '신작', '랭킹', '태그'].map((n) => ({ name: n, on: s.tab === n, bg: s.tab === n ? '#ffffff' : 'transparent', color: s.tab === n ? '#17151f' : '#c9c4da', pick: () => this.setState({ tab: n, chip: 0 }) }));
    const CHIPS = { '홈': ['#アイドル', '#ハーレム', '#NTR', '#ギャップ萌え', '#ツンデレ', '#純愛'], '신작': ['24시간', '3일', '1주'], '랭킹': ['일간', '주간', '월간', '1:1', 'NTR', '그룹'], '태그': ['#幼なじみ', '#上司', '#配信者', '#大学', '#巨乳', '#眼鏡'] };
    const chips = CHIPS[s.tab].map((n, i) => ({ name: n, bg: s.chip === i ? '#3a1428' : '#16131f', bd: s.chip === i ? '1px solid #ff3d7f' : '1px solid rgba(255,255,255,0.08)', pick: () => this.setState({ chip: i }) }));
    const order = ['c05', 'c01', 'c09', 'c06', 'c02', 'c03', 'c08', 'c04', 'c07', 'c10', 'c06'];
    const isRank = s.tab === '랭킹';
    const rc = (i) => (i === 0 ? '#ffc847' : i === 1 ? '#e5e7eb' : '#f0a46b');
    const top3 = order.slice(0, 3).map((k, i) => ({ ...by(k), rank: i + 1, rc: rc(i), hasImg: !!by(k).img }));
    const grid = isRank ? order.slice(3, 11).map((k, i) => ({ ...by(k), rank: i + 4, move: ['▼2', 'NEW', '▲3', '▲5', '▼1', '▲4', 'NEW', '–'][i] })) : (s.tab === '신작' ? CH.filter((c) => c.isNew).concat(CH.slice(0, 3)).map((c) => ({ ...c, isNew: true })) : ['c06', 'c01', 'c09', 'c08', 'c02', 'c10', 'c05', 'c03'].map(by));
    return { tabs, chips, isRank, top3, grid };
  }
}
</script>
</body>
</html>
